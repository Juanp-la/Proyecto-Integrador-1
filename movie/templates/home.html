<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Home - Movie Reviews</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    
    <h1 class="mb-4">Welcome to Home Page, {{ name }}</h1>
    
    <form action="" method="GET" class="mb-5 d-flex">
        <input type="text" name="searchMovie" class="form-control me-2" placeholder="Search for a movie..." value="{{ searchTerm|default_if_none:'' }}">
        <button type="submit" class="btn btn-primary">Search</button>
    </form>
    
    <div class="row">
        {% for movie in movies %}
        <div class="col-md-4 mb-4">
            <div class="card h-100">
                <img src="{{ movie.image.url }}" class="card-img-top" alt="{{ movie.title }}">
                <div class="card-body">
                    <h5 class="card-title">{{ movie.title }}</h5>
                    <p class="card-text">{{ movie.description }}</p>
                    {% if movie.url %}
                    <a href="{{ movie.url }}" class="btn btn-info" target="_blank">Watch Now</a>
                    {% endif %}
                </div>
            </div>
        </div>
        {% empty %}
        <div class="col-12">
            <p class="text-danger">No se encontraron películas.</p>
        </div>
        {% endfor %}
    </div>

</body>
</html>
