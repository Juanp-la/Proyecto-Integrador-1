{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <form action="" method="GET" class="mb-3">
        <label for="searchMovie" class="form-label">Search for Movie:</label>
        <div class="d-flex">
            <input type="text" class="form-control me-2" name="searchMovie" value="{{ searchTerm|default_if_none:'' }}"/>
            <button type="submit" class="btn btn-primary">Search</button>
        </div>
    </form>
    
    <div class="row row-cols-1 row-cols-md-3 g-4">
        {% for movie in movies %}
        <div class="col">
            <div class="card h-100">
                <img src="{{ movie.image.url }}" class="card-img-top" alt="...">
                <div class="card-body">
                    <h5 class="card-title fw-bold">{{ movie.title }}</h5>
                    <p class="card-text">{{ movie.description }}</p>
                    <p class="card-text"><small class="text-muted">Genre: {{ movie.genre }} | Year: {{ movie.year }}</small></p>
                    {% if movie.url %}
                        <a href="{{ movie.url }}" class="btn btn-primary" target="_blank">Movie Link</a>
                    {% endif %}
                </div>
            </div>
        </div>
        {% endfor %}
    </div>

    <br/><br/>
    <h2>Join our mailing list:</h2>
    <form action="{% url 'signup' %}" method="GET">
        <div class="mb-3">
            <label for="email" class="form-label">Enter your email:</label>
            <input type="email" class="form-control" name="email" required />
        </div>
        <button type="submit" class="btn btn-primary">Sign Up</button>
    </form>
</div>
{% endblock content %}
