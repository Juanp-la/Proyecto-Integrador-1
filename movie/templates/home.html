{% extends 'base.html' %}
{% block content %}

<form action="">
    <div class="mb-3">
        <label for="searchMovie" class="form-label">Search for Movie:</label>
        <input type="text" class="form-control" name="searchMovie"/>
    </div>
    <button type="submit" class="btn btn-primary">Search</button>
</form>
<p>Searching for {{ searchTerm }}</p>

<div class="row row-cols-2 row-cols-md-4 row-cols-lg-5 g-3">
    {% for movie in movies %}
    <div class="col">
        <div class="card h-100">
            <img src="{{ movie.image.url }}" class="card-img-top" style="height: 160px; object-fit: cover;" alt="...">
            <div class="card-body p-2">
                <h6 class="card-title mb-1">{{ movie.title }}</h6>
                <p class="card-text small text-muted mb-1" style="font-size: 0.75rem;">{{ movie.description|truncatechars:60 }}</p>
                <p class="card-text mb-1"><small class="text-muted" style="font-size: 0.7rem;">{{ movie.genre }} | {{ movie.year }}</small></p>
                {% if movie.url %}
                    <a href="{{ movie.url }}" class="btn btn-sm btn-outline-primary">Movie Link</a>
                {% endif %}
            </div>
        </div>
    </div>
    {% endfor %}
</div>
</div>
<br/>

{% endblock content %}
