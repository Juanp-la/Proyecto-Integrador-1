<head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<div class="container mt-4">
    <h1>Welcome to Home Page, {{ name }}</h1>

    <form action="" class="mb-4">
        <div class="row g-2 align-items-end">
            <div class="col-auto">
                <label for="searchMovie" class="form-label">Search for Movie:</label>
                <input type="text" class="form-control" name="searchMovie"/>
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-primary">Search</button>
            </div>
        </div>
    </form>

    <p>Searching for {{ searchTerm }}</p>

    <div class="row row-cols-2 row-cols-md-4 g-3">
        {% for movie in movies %}
            <div class="col">
                <div class="card h-100">
                    <img src="{{ movie.image.url }}" class="card-img-top" style="height: 180px; object-fit: cover;">
                    <div class="card-body p-2">
                        <h6 class="card-title mb-1">{{ movie.title }}</h6>
                        <p class="card-text small text-muted" style="font-size: 0.75rem;">{{ movie.description }}</p>
                        {% if movie.url %}
                            <a href="{{ movie.url }}" class="btn btn-sm btn-outline-primary">Movie Link</a>
                        {% endif %}
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
</div>
