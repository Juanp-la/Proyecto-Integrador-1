{% extends "base.html" %}

{% block title %}Movie Reviews — Statistics{% endblock %}

{% block content %}
<div class="stats-wrap">
  <h1 class="display">Movies per year chart</h1>
  <img src="data:image/png;base64,{{ graphic_year }}" alt="Movies per year chart">

  <h1 class="display">Movies per genre chart</h1>
  <img src="data:image/png;base64,{{ graphic_genre }}" alt="Movies per genre chart">
</div>
{% endblock %}
